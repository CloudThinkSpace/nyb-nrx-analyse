name: Build

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

env:
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            # 全部使用 npx pnpm，不需要全局安装
            - name: Install dependencies
              run: npx pnpm install

            - name: Build Tauri Windows x64
              run: npx pnpm tauri build --target x86_64-pc-windows-msvc

            - name: Upload Windows installers
              uses: actions/upload-artifact@v4
              with:
                  name: nyb-nrx-analyse-windows
                  path: |
                      src-tauri/target/release/bundle/msi/*.msi
                      src-tauri/target/release/bundle/nsis/*.exe

    build-macos:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Install dependencies
              run: npx pnpm install

            - name: Build Tauri macOS arm64
              run: npx pnpm tauri build --target aarch64-apple-darwin

            - name: Upload macOS dmg
              uses: actions/upload-artifact@v4
              with:
                  name: nyb-nrx-analyse-macos
                  path: src-tauri/target/release/bundle/dmg/*.dmg
